name: Build native Magic Keyboard helper

on:
  push:
    branches: [ main ]
    paths:
      - 'src/main.c'
      - 'launchd/com.landco.magic-keyboard-keymap.attach.plist'
      - 'launchd/com.landco.magic-keyboard-keymap.login.plist'
      - 'install.sh'
      - 'uninstall.sh'
      - '1-INSTALL.command'
      - '2-CHECK.command'
      - '3-UNINSTALL.command'
      - 'README_RU.txt'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Build ARM64 helper
        run: |
          set -euo pipefail
          mkdir -p build

          xcrun clang \
            -arch arm64 \
            -mmacosx-version-min=15.0 \
            -std=c11 -Os -Wall -Wextra -Werror -fblocks \
            src/main.c \
            -framework CoreFoundation \
            -framework IOKit \
            -o build/magic-keyboard-keymap

          codesign --force --sign - --timestamp=none build/magic-keyboard-keymap

      - name: Verify binary
        run: |
          set -euo pipefail
          file build/magic-keyboard-keymap | tee build/BUILD-INFO.txt
          lipo -archs build/magic-keyboard-keymap | tee -a build/BUILD-INFO.txt
          otool -L build/magic-keyboard-keymap | tee -a build/BUILD-INFO.txt
          codesign -dv --verbose=4 build/magic-keyboard-keymap 2>&1 | tee -a build/BUILD-INFO.txt
          codesign --verify --strict --verbose=2 build/magic-keyboard-keymap
          test "$(lipo -archs build/magic-keyboard-keymap)" = "arm64"
          ./build/magic-keyboard-keymap --version | tee -a build/BUILD-INFO.txt
          ./build/magic-keyboard-keymap --version | grep -q '2.1.0'

      - name: Validate launchd plists
        run: |
          set -euo pipefail
          plutil -lint launchd/com.landco.magic-keyboard-keymap.attach.plist
          plutil -lint launchd/com.landco.magic-keyboard-keymap.login.plist

          grep -Fq '/Users/m1/bin/Magic Keyboard — Login'             launchd/com.landco.magic-keyboard-keymap.login.plist

          grep -Fq '/Users/m1/bin/Magic Keyboard — Reconnect'             launchd/com.landco.magic-keyboard-keymap.attach.plist

          ! grep -q '<key>KeepAlive</key>' launchd/com.landco.magic-keyboard-keymap.attach.plist
          ! grep -q '<key>KeepAlive</key>' launchd/com.landco.magic-keyboard-keymap.login.plist
          ! grep -q '<key>StartInterval</key>' launchd/com.landco.magic-keyboard-keymap.attach.plist
          ! grep -q '<key>StartInterval</key>' launchd/com.landco.magic-keyboard-keymap.login.plist

      - name: Prepare user package
        run: |
          set -euo pipefail

          PKG="MagicKeyboard-Launchpad-Native-v2.1-arm64"
          mkdir -p "$PKG"

          cp build/magic-keyboard-keymap "$PKG/"
          cp launchd/com.landco.magic-keyboard-keymap.attach.plist "$PKG/"
          cp launchd/com.landco.magic-keyboard-keymap.login.plist "$PKG/"
          cp install.sh uninstall.sh "$PKG/"
          cp 1-INSTALL.command 2-CHECK.command 3-UNINSTALL.command "$PKG/"
          cp README_RU.txt "$PKG/"
          cp build/BUILD-INFO.txt "$PKG/"

          chmod 755 \
            "$PKG/magic-keyboard-keymap" \
            "$PKG/install.sh" \
            "$PKG/uninstall.sh" \
            "$PKG/1-INSTALL.command" \
            "$PKG/2-CHECK.command" \
            "$PKG/3-UNINSTALL.command"

          (
            cd "$PKG"
            shasum -a 256 \
              magic-keyboard-keymap \
              com.landco.magic-keyboard-keymap.attach.plist \
              com.landco.magic-keyboard-keymap.login.plist \
              install.sh uninstall.sh \
              1-INSTALL.command 2-CHECK.command 3-UNINSTALL.command \
              README_RU.txt BUILD-INFO.txt > SHA256SUMS.txt
          )

          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "$PKG" \
            "MagicKeyboard-Launchpad-Native-v2.1-arm64.zip"

      - name: Verify final ZIP
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          /usr/bin/ditto -x -k MagicKeyboard-Launchpad-Native-v2.1-arm64.zip "$TMP"

          cd "$TMP/MagicKeyboard-Launchpad-Native-v2.1-arm64"
          shasum -a 256 -c SHA256SUMS.txt

          test -x magic-keyboard-keymap
          test -x 1-INSTALL.command
          test -x 2-CHECK.command
          test -x 3-UNINSTALL.command
          ./magic-keyboard-keymap --version | grep -q '2.1.0'

      - uses: actions/upload-artifact@v4
        with:
          name: MagicKeyboard-Launchpad-Native-v2.1-arm64
          path: MagicKeyboard-Launchpad-Native-v2.1-arm64.zip
          retention-days: 30
